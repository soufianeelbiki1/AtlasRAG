name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlasrag
          POSTGRES_PASSWORD: atlasrag
          POSTGRES_DB: atlasrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasrag -d atlasrag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://atlasrag:atlasrag@localhost:5432/atlasrag
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Compile
        run: python -m compileall -q app tests

      - name: Test
        run: pytest -q
